  <!--
    GitHub Pages SPA restore script (adapted from rafgraph/spa-github-pages).
    Runs before React mounts. If the user deep-linked/refreshed a route,
    404.html redirected here with the path encoded as "?/...". We decode it
    and use history.replaceState to restore the real URL so BrowserRouter
    renders the correct route without a server round-trip.
  -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>

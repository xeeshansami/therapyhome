<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TherapyHome</title>
    <!--
      GitHub Pages SPA redirect (adapted from rafgraph/spa-github-pages).
      GitHub Pages serves this 404.html for any unknown path (e.g. a deep link
      like /therapyhome/Admin/dashboard refreshed directly). We encode the path
      into a query string and bounce to the app root, where the restore script
      in index.html rewrites the URL back to the real route before React mounts.

      pathSegmentsToKeep = 1 keeps the project repo segment ("/therapyhome") in
      the path. Set to 0 for a user/organization root site (username.github.io).
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
